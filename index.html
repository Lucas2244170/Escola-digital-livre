<!DOCTYPE html>
<!-- Deus é fiel. -->
<!-- Declara que este documento usa HTML5 -->

<html lang="pt-BR">
    <!-- Elemento raiz da página. lang="pt-BR" define o idioma -->

<head>
    <!-- Informações de bastidores: não aparecem diretamente na tela -->

    <meta charset="UTF-8">
    <!-- Codificação de caracteres, garante acentos corretos -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ativa a responsividade em dispositivos móveis -->

    <title>Escola Digital Livre</title>
    <!-- Título exibido na aba do navegador -->

    <link rel="stylesheet" href="style.css">
    <!-- Conecta o arquivo de estilos (CSS) -->
</head>

<body>
    <!-- Tudo o que o usuário vê e interage fica aqui -->

    <header class="header">
        <!-- Tag semântica: indica o cabeçalho da página -->

        <div class="header-container">
            <!-- Container que agrupa e centraliza o conteúdo do header -->

            <a href="./index.html" class="logo">
                <!-- Logo clicável, leva para a página inicial -->

                <img
                    src="./assets/Logo.png"
                    alt="Logo Escola Digital Livre"
                    width="60"
                >
                <!-- img: adiciona imagem
                     src: caminho da imagem
                     alt: descrição da imagem -->

                <span class="logo-text">
                    <span class="logo-title">Escola Digital Livre</span>
                    <span class="logo-subtitle">Tecnologia para todos</span>
                </span>
            </a>

            <nav class="main-nav">
                <!-- Tag semântica para o menu de navegação -->

                <a href="./index.html" class="nav-link">
                    Início
                </a>

                <a href="./cursos.html" class="nav-link active">
                    Cursos
                </a>

                <a href="#" class="nav-link">
                    Sobre
                </a>

                <a href="#" class="nav-link">
                    Contatos
                </a>
            </nav>

            <div class="header-actions">
                <!-- Agrupa os elementos de ação do header -->

                <div class="search-box">
                    <!-- Caixa de pesquisa -->

                    <input
                        type="text"
                        placeholder="Buscar"
                    >
                    <!-- Campo de entrada -->

                    <img
                        src="./assets/ícons8-search.svg"
                        alt="Ícone de pesquisa"
                    >
                    <!-- Ícone vetorial da lupa -->
                </div>

                <div class="search-actions">
                    <!-- Agrupa ações relacionadas à pesquisa -->

                    <button class="btn-primary">
                        Botão
                    </button>
                    <!-- Botão para ações da página -->
                </div>
            </div>

        </div>
    </header>

    <main>
        <h1>Desenvolvimento Web</h1>
    </main>

</body>
</html>
